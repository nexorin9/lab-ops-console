<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>检验仪器接入与危急值闭环系统 · 信息科面板</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    header { background: var(--c-primary); color: var(--c-primary-ink); padding: var(--sp-3) var(--sp-6); display: flex; align-items: center; gap: var(--sp-4); }
    header h1 { font-size: var(--fs-lg); margin: 0; }
    header nav a { color: var(--c-primary-ink); margin-left: var(--sp-4); }
    .wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); padding: var(--sp-5); }
    section { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: var(--sp-4); box-shadow: var(--shadow-1); }
    section h2 { font-size: var(--fs-md); margin: 0 0 var(--sp-3); }
    .filters { margin-bottom: var(--sp-3); }
    .filters button { font-size: var(--fs-xs); padding: 4px 10px; margin-right: var(--sp-2); }
    .filters button.active { background: var(--c-primary); color: #fff; }
    .critical-card { border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: var(--sp-3); margin-bottom: var(--sp-3); }
    .critical-card .value { font-size: var(--fs-xl); font-weight: 700; }
    .critical-card .unit { font-size: var(--fs-md); color: var(--c-text-muted); }
    .critical-card .meta { font-size: var(--fs-sm); color: var(--c-text-muted); margin: var(--sp-2) 0; }
    .critical-card .actions button { margin-right: var(--sp-2); margin-top: var(--sp-2); }
    ul.candidates { list-style: none; padding: 0; margin: var(--sp-2) 0 0; }
    ul.candidates li.candidate { border-top: 1px dashed var(--c-border); padding: var(--sp-2) 0; display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
    .c-role { font-weight: 600; }
    .c-meta { font-size: var(--fs-xs); color: var(--c-text-muted); }
    .c-reason { font-size: var(--fs-xs); color: var(--c-text-muted); flex-basis: 100%; }
    #fhir-debug pre { font-family: var(--font-mono); font-size: var(--fs-xs); white-space: pre-wrap; background: var(--c-bg); padding: var(--sp-2); border-radius: var(--radius-sm); }
    #ws-state { margin-left: auto; font-size: var(--fs-sm); }
  </style>
</head>
<body>
  <header>
    <h1>检验仪器接入与危急值闭环系统</h1>
    <nav><a href="/">总览</a><a href="/panel.html">信息科面板</a><a href="/critical">护士站大屏</a></nav>
    <span id="ws-state">连接中</span>
  </header>
  <div id="ws-banner">已断开，正在重连…</div>

  <div class="wrap">
    <section id="devices">
      <h2>设备列表与心跳</h2>
      <div id="device-rows" data-region="devices"></div>
    </section>
    <section id="samples">
      <h2>最近样本</h2>
      <div id="sample-recent" data-region="sample"></div>
    </section>
    <section id="criticals">
      <h2>危急值</h2>
      <div class="filters">
        <button class="active" data-filter="requested">未完成</button>
        <button data-filter="received">已接收</button>
        <button data-filter="completed">已处置</button>
        <button data-filter="">全部</button>
      </div>
      <div id="critical-list" data-region="criticals"></div>
    </section>
    <section id="fhir-debug">
      <h2>FHIR 写回调试</h2>
      <div id="fhir-debug-body" data-region="fhir"></div>
    </section>
  </div>

  <script type="module" src="/render.js"></script>
  <script type="module" src="/panel.js"></script>
</body>
</html>
